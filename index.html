<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Uploader to Google Drive</title>
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" data-aos="fade-up">
        <div id="auth-container" data-aos="fade-in" data-aos-delay="200">
            <button id="login-button">Login with Google</button>
        </div>
        <div id="user-info" style="display: none;" data-aos="fade-in" data-aos-delay="200">
            <p>Welcome, <span id="user-name"></span>!</p>
            <button id="logout-button">Logout</button>
        </div>
        <h1 data-aos="fade-in" data-aos-delay="300">Upload Files to Google Drive</h1>
        <div id="uploader" style="display: none;" data-aos="fade-in" data-aos-delay="400">
            <div class="upload-container">
                <input type="file" id="file-input" multiple accept="image/*,video/*">
                <label for="file-input" class="file-label">
                    <span>Choose files</span>
                </label>
                <div id="preview-container"></div>
                <button id="upload-button">Upload</button>
            </div>
        </div>
        <div class="status-container" data-aos="fade-in" data-aos-delay="500">
            <h2>Status</h2>
            <div id="status">
                <p>No files uploaded yet.</p>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
      AOS.init();
    </script>
    <script src="script.js"></script>
</body>
</html>
